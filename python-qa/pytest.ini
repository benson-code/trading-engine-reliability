[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -ra shows the reason for every non-passing test — what you want in a CI log.
# --strict-markers turns a typo'd marker into an error instead of a silent no-op.
addopts =
    -ra
    --strict-markers
    --tb=short

markers =
    smoke: minimal release gate — must pass before anything else runs
    contract: response shape / status code contract of the REST API
    validation: input validation and boundary values
    idempotency: retry-safety of the payment create endpoint
    concurrency: behaviour under simultaneous requests
    auth: X-API-Key authentication
    websocket: the trading engine's real-time stream (starts its own engine, stopped)
    slow: takes seconds, not milliseconds (excluded from the fast gate)

# Fail on unraisable warnings from the HTTP layer rather than burying them.
filterwarnings =
    default
