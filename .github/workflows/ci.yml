name: Binance QA Suite CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ── 機密掃描：任何建置之前先跑，這是公開 repo ──────────────────
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No credentials in version control
        run: tools/check-no-secrets.sh

  # ── 可觀測性平台：設定即程式碼，要通過 CI 才能合併 ─────────────────
  observability:
    name: Observability Config
    runs-on: ubuntu-latest
    needs: secrets

    steps:
      - uses: actions/checkout@v4

      # 告警規則語法。錯誤的規則會讓 Prometheus 整份 rule file 載入失敗 ——
      # 也就是說一個 typo 可以讓所有告警靜默，這比沒有告警更危險。
      - name: Validate Prometheus config & alert rules
        run: |
          docker run --rm -v "$PWD/deploy/observability/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.1.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/deploy/observability/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.1.0 \
            check rules /etc/prometheus/alerts.yml

      - name: Validate Alertmanager routing config
        run: |
          docker run --rm -v "$PWD/deploy/observability/alertmanager:/cfg:ro" \
            --entrypoint amtool prom/alertmanager:v0.28.0 \
            check-config /cfg/alertmanager.yml

      # 每條告警都必須有對應的處理 SOP。
      # 沒有 runbook 的告警等於把問題丟給半夜被叫起來的人自己想。
      - name: Alert → Runbook coverage gate
        run: tools/check-alert-runbooks.sh

      - name: Validate Grafana dashboard JSON
        run: |
          for f in deploy/observability/grafana/dashboards/*.json; do
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); \
              assert d.get('uid'), 'missing uid'; assert d.get('panels'), 'no panels'; \
              print(f\"  ok {sys.argv[1]} — {d['title']} ({len(d['panels'])} panels)\")" "$f"
          done


      - name: Validate compose file
        run: docker compose -f deploy/observability/docker-compose.yml config --quiet

      # 密碼檔不得進版控
      - name: Ensure no credentials committed
        run: |
          if git ls-files --error-unmatch deploy/observability/mysqld/.my.cnf 2>/dev/null; then
            echo "::error::deploy/observability/mysqld/.my.cnf 含有密碼，不得提交"
            exit 1
          fi
          echo "  ok — 密碼檔未進版控"

  # ── Java: all modules (payment-api + trading-engine-simulator) ──────────
  java-tests:
    name: Java Tests
    runs-on: ubuntu-latest
    needs: secrets

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Guards the defect class behind the 2026-07 GC death spiral: a collection field on a
      # long-lived object with no eviction and no stated reason it cannot grow.
      # See docs/checklists/resource-safety-zh-TW.md
      - name: Bounded-collections check
        run: tools/check-bounded-collections.sh

      - name: Run all Java tests (both modules)
        run: mvn test --no-transfer-progress

      - name: Upload Allure report — payment-api
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-payment-api
          path: payment-api/target/site/allure-maven-plugin/
          retention-days: 14

      - name: Upload Allure report — trading-engine
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-trading-engine
          path: trading-engine-simulator/target/site/allure-maven-plugin/
          retention-days: 14

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            payment-api/target/surefire-reports/
            trading-engine-simulator/target/surefire-reports/
          retention-days: 14

  # ── Frontend: Next.js type check + build ────────────────────────────────
  ui-build:
    name: UI Build Check (Next.js 15)
    runs-on: ubuntu-latest
    needs: secrets

    defaults:
      run:
        working-directory: trading-engine-ui

    steps:
      - uses: actions/checkout@v4

      # Same contract as the Java gate, applied to the frontend: every long-lived collection
      # must state why it cannot grow without bound. Stricter than the Java version — it infers
      # no eviction at all, because a .slice() elsewhere in the file would otherwise mask the
      # very defects this gate exists to catch.
      # See docs/checklists/resource-safety-zh-TW.md
      - name: Bounded-collections check (TypeScript)
        run: ../tools/check-bounded-collections-ts.sh .

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: trading-engine-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8092
          NEXT_PUBLIC_WS_URL: ws://localhost:8093

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Endurance, not functional: drives 40k orders through the hook and asserts that
      # retained memory did not grow with them. Functional tests cannot see this defect
      # class — the whole suite stayed green through the 2026-07 incident.
      # The suite builds into .next-e2e on its own port, so it does not disturb the
      # build above.
      - name: Mobile-web endurance tests (Pixel 7)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: trading-engine-ui/playwright-report/
          retention-days: 14
