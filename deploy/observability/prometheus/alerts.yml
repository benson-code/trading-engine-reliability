# ══════════════════════════════════════════════════════════════════
#  告警規則 —— 八層，每一層回答一個不同的問題
#
#   1 availability  使用者現在打得到嗎？        （黑箱）
#   2 work-progress 工作有在前進嗎？            （事故 #2 的簽名）
#   3 jvm-gc        JVM 還健康嗎？              （事故 #1 的簽名）
#   4 saturation    資源快用完了嗎？            （USE 方法）
#   5 capacity      多久之後會用完？            （容量規劃）
#   6 dependencies  相依的元件還在嗎？          （MySQL / Redis）
#   7 meta         監控系統自己還活著嗎？      （含死人開關）
#   8 application  請求真的成功了嗎？          （服務自報的 RED）
#
#  第 7 層是把前面兩次事故的教訓套回監控系統自己：
#  「沒有告警」有兩種可能 —— 一切正常，或告警系統死了。
#
#  每條規則都必須有 runbook_url。沒有 SOP 的告警等於把問題丟給
#  半夜被叫起來的人自己想 —— 那是告警設計的失職，不是值班的問題。
# ══════════════════════════════════════════════════════════════════

groups:

# ─────────────────────────────────────────────────────────────────
# 1. 可用性 —— 從外部探測，不問服務自己
# ─────────────────────────────────────────────────────────────────
- name: availability
  rules:
    - alert: ServiceDown
      expr: probe_success == 0
      for: 1m
      labels: { severity: critical, category: availability, service: "{{ $labels.instance }}" }
      annotations:
        summary: "{{ $labels.instance }} 外部探測失敗"
        description: "黑箱探測連續 1 分鐘失敗。這是使用者實際感受到的狀態，優先於任何服務自報的指標。"
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/service-down.md"

    - alert: ServiceSlowResponse
      expr: probe_duration_seconds > 1
      for: 5m
      labels: { severity: warning, category: availability, service: "{{ $labels.instance }}" }
      annotations:
        summary: "{{ $labels.instance }} 回應時間 {{ $value | humanizeDuration }}"
        description: "探測耗時超過 1 秒。GC 壓力上升時這條通常比 ServiceDown 先亮。"
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/service-slow.md"

    - alert: HostDown
      expr: up{job="node"} == 0
      for: 2m
      labels: { severity: critical, category: availability }
      annotations:
        summary: "主機 {{ $labels.instance }} 失聯"
        description: "node_exporter 無回應。此告警會抑制該主機上所有其他告警。"
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/host-down.md"

# ─────────────────────────────────────────────────────────────────
# 2. 工作進度 —— 事故 #2 的直接對策
#    「進程活著」不等於「服務在工作」。systemd 回報 active、
#    port 有 bind、/status 回 200，但業務執行緒六天沒動。
# ─────────────────────────────────────────────────────────────────
- name: work-progress
  rules:
    - alert: EngineNotProgressing
      expr: up{job="trading-engine"} == 1 and rate(engine_orders_generated_total{job="trading-engine"}[10m]) == 0
      for: 10m
      labels: { severity: critical, category: work-progress, service: trading-engine }
      annotations:
        summary: "trading-engine 可達但訂單產生器沒有前進"
        description: >-
          採集得到引擎（up=1，Prometheus 自己觀測到的，不是服務自報），但 10 分鐘內累計訂單數完全沒有增加。
          2026-07 的第二次事故就是這個形狀：unattended-upgrades 重啟 MySQL 連帶
          SIGTERM 掉服務，systemd 成功重啟了進程，但 worker thread 被
          in-memory AtomicBoolean 擋住沒有恢復，靜默六天無人察覺。
          所有 liveness check 在那六天內全部通過。
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/engine-not-progressing.md"

    - alert: EngineWorkerStopped
      expr: up{job="trading-engine"} == 1 and engine_running{job="trading-engine"} == 0
      for: 5m
      labels: { severity: critical, category: work-progress, service: trading-engine }
      annotations:
        summary: "trading-engine 的產生器旗標為停止（engine_running=0）"
        description: "服務可達但自報未在運行。重啟後未自動恢復是已知缺陷。"
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/engine-not-progressing.md"

    - alert: DatabaseWriteStalled
      expr: engine_running{job="trading-engine"} == 1 and rate(engine_orders_generated_total{job="trading-engine"}[15m]) == 0
      for: 15m
      labels: { severity: critical, category: work-progress, service: trading-engine }
      annotations:
        summary: "產生器自報運行中，但 15 分鐘沒有任何寫入"
        description: "自報狀態與實際產出矛盾 —— 服務在說謊，優先相信計數器。"
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/engine-not-progressing.md"

# ─────────────────────────────────────────────────────────────────
# 3. JVM / GC —— 事故 #1 的直接對策（閾值全部由實測值反推）
# ─────────────────────────────────────────────────────────────────
- name: jvm-gc
  rules:
    - alert: JvmOldGenHigh
      expr: jvm_oldgen_utilization_ratio > 0.85
      for: 5m
      labels: { severity: warning, category: saturation, service: trading-engine }
      annotations:
        summary: "老年代使用率 {{ $value | humanizePercentage }} 持續 5 分鐘偏高"
        description: "無界集合造成物件無法回收時，這裡會先亮。2026-07 的死亡螺旋事故就是從這裡開始。"
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/gc-death-spiral.md"

    - alert: JvmGcTimeRatioHigh
      expr: (jvm_gc_full_seconds_total / jvm_uptime_seconds) > 0.10
      for: 10m
      labels: { severity: critical, category: saturation, service: trading-engine }
      annotations:
        summary: "Full GC 佔用 {{ $value | humanizePercentage }} 的行程存活時間"
        description: "事故基準值：491,218s STW / 1,120,514s uptime = 43.8%（另以 /proc CPU 統計交叉驗算得 43.4%）。超過 10% 即應介入。"
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/gc-death-spiral.md"

    - alert: JvmFullGcRateHigh
      expr: rate(jvm_gc_full_count[5m]) > 0.1
      for: 5m
      labels: { severity: critical, category: saturation, service: trading-engine }
      annotations:
        summary: "Full GC 頻率 {{ $value }}/s — 死亡螺旋前兆"
        description: "背靠背 Full GC 表示回收不到空間。事故時累計 114,879 次。"
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/gc-death-spiral.md"

    - alert: JstatAttachFailed
      expr: jvm_jstat_attach_success == 0
      for: 2m
      labels: { severity: critical, category: availability, service: trading-engine }
      annotations:
        summary: "jstat 無法 attach 到 JVM"
        description: >-
          JVM 飽和時 attach 機制會失效（2026-07-14 事故實測，jcmd/jstack 同時逾時）。
          診斷工具失效本身是症狀，不是「沒有資料」。此時應改由 DB 側界定影響範圍。
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/jstat-attach-failed.md"

# ─────────────────────────────────────────────────────────────────
# 4. 飽和度 —— USE 方法（Utilisation / Saturation / Errors）
# ─────────────────────────────────────────────────────────────────
- name: saturation
  rules:
    - alert: HostCpuSaturated
      expr: 100 * (1 - avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 85
      for: 10m
      labels: { severity: warning, category: saturation }
      annotations:
        summary: "CPU 使用率 {{ $value | printf \"%.1f\" }}%"
        description: "事故當時兩顆核心被 GC 執行緒占滿，load average 2.03 / 2 cores。"
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/host-saturation.md"

    - alert: HostLoadHigh
      expr: node_load1 / count by(instance) (node_cpu_seconds_total{mode="idle"}) > 1.5
      for: 10m
      labels: { severity: warning, category: saturation }
      annotations:
        summary: "每核心 load {{ $value | printf \"%.2f\" }}（>1.5 表示有排隊）"
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/host-saturation.md"

    - alert: HostMemoryLow
      expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.15
      for: 10m
      labels: { severity: warning, category: saturation }
      annotations:
        summary: "可用記憶體僅剩 {{ $value | humanizePercentage }}"
        description: "此主機 swap = 0，記憶體壓力沒有緩衝空間。"
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/host-saturation.md"

    - alert: HostDiskLow
      expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
      for: 10m
      labels: { severity: warning, category: saturation }
      annotations:
        summary: "根目錄可用空間 {{ $value | humanizePercentage }}"
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/disk-capacity.md"

# ─────────────────────────────────────────────────────────────────
# 5. 容量規劃 —— 不問「現在滿了嗎」，問「多久之後會滿」
#    predict_linear 用歷史斜率外推。這是 JD「容量規劃」那條的實作。
# ─────────────────────────────────────────────────────────────────
- name: capacity
  rules:
    - alert: DiskWillFillIn24h
      expr: predict_linear(node_filesystem_avail_bytes{mountpoint="/"}[6h], 24*3600) < 0
      for: 30m
      labels: { severity: warning, category: capacity }
      annotations:
        summary: "依過去 6 小時的成長率，根目錄將在 24 小時內用盡"
        description: "預測性告警：在還有時間處理的時候通知，而不是等到磁碟滿了才叫。"
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/disk-capacity.md"

    - alert: DiskWillFillIn7d
      expr: predict_linear(node_filesystem_avail_bytes{mountpoint="/"}[24h], 7*24*3600) < 0
      for: 2h
      labels: { severity: info, category: capacity }
      annotations:
        summary: "依過去 24 小時的成長率，根目錄將在 7 天內用盡"
        description: "進 Sprint backlog 的等級，不需要立即處理。"
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/disk-capacity.md"

    - alert: RedisIsUnbounded
      expr: redis_config_maxmemory == 0
      for: 15m
      labels: { severity: warning, category: capacity, service: redis }
      annotations:
        summary: "Redis 未設定 maxmemory —— 無界"
        description: >-
          maxmemory=0 表示 Redis 會一直長到把主機記憶體吃光為止。
          這與 2026-07 事故中 OrderBook 三個無界集合是同一個缺陷類別：
          只進不出、沒有容量上限、沒有淘汰機制。
          修法：設定 maxmemory 並選擇 eviction policy（allkeys-lru / volatile-ttl）。
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/redis-unbounded.md"

    - alert: JvmHeapGrowthUnbounded
      expr: predict_linear(jvm_oldgen_used_bytes[6h], 24*3600) > jvm_oldgen_capacity_bytes
      for: 1h
      labels: { severity: warning, category: capacity, service: trading-engine }
      annotations:
        summary: "依成長率，老年代將在 24 小時內填滿"
        description: >-
          這條是事故 #1 的「早期版本」：在死亡螺旋開始之前 6 天就會亮。
          事故實際歷程是執行 7.6 天累積 1,136 萬筆訂單後才耗盡 heap。
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/gc-death-spiral.md"

# ─────────────────────────────────────────────────────────────────
# 6. 相依元件 —— MySQL / Redis
# ─────────────────────────────────────────────────────────────────
- name: dependencies
  rules:
    - alert: MysqlDown
      expr: mysql_up == 0
      for: 1m
      labels: { severity: critical, category: availability, service: mysql }
      annotations:
        summary: "MySQL 無法連線"
        description: "事故 #2 的觸發點就是 unattended-upgrades 重啟了 MySQL。"
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/mysql-down.md"

    - alert: MysqlConnectionsHigh
      expr: mysql_global_status_threads_connected / mysql_global_variables_max_connections > 0.8
      for: 5m
      labels: { severity: warning, category: saturation, service: mysql }
      annotations:
        summary: "MySQL 連線數達上限的 {{ $value | humanizePercentage }}"
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/mysql-saturation.md"

    - alert: MysqlSlowQueriesRising
      expr: rate(mysql_global_status_slow_queries[10m]) > 0.1
      for: 10m
      labels: { severity: warning, category: saturation, service: mysql }
      annotations:
        summary: "慢查詢速率 {{ $value | printf \"%.2f\" }}/s"
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/mysql-saturation.md"

    - alert: RedisDown
      expr: redis_up == 0
      for: 1m
      labels: { severity: critical, category: availability, service: redis }
      annotations:
        summary: "Redis 無法連線"
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/redis-down.md"

    - alert: RedisMemoryHigh
      expr: redis_config_maxmemory > 0 and redis_memory_used_bytes / redis_config_maxmemory > 0.9
      for: 5m
      labels: { severity: warning, category: saturation, service: redis }
      annotations:
        summary: "Redis 記憶體達上限的 {{ $value | humanizePercentage }}"
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/redis-unbounded.md"

    - alert: RedisEvictionSpike
      expr: rate(redis_evicted_keys_total[5m]) > 10
      for: 5m
      labels: { severity: warning, category: saturation, service: redis }
      annotations:
        summary: "Redis 淘汰速率 {{ $value | printf \"%.1f\" }} keys/s"
        description: >-
          淘汰本身是健康的（表示上限有在生效），但速率過高代表容量不足，
          cache 命中率會下降，壓力會轉嫁到後端 DB。
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/redis-unbounded.md"

# ─────────────────────────────────────────────────────────────────
# 7. 監控系統自身 —— 誰在監控監控系統？
#
#    這一組是本專案兩次事故的教訓套用在監控堆疊自己身上。
#
#    事故 #1 與 #2 的共同形狀：服務安靜下來，而所有人把沉默
#    當成健康。監控系統會用完全一樣的方式壞掉 ——
#    規則評估失敗、採集器掛掉、通知管道靜默，
#    而儀表板上什麼都不會變紅，因為根本沒有資料進來。
#
#    「沒有告警」有兩種可能：一切正常，或告警系統死了。
#    這一組的存在就是為了把這兩種區分開來。
# ─────────────────────────────────────────────────────────────────
- name: meta
  rules:

    # ── 死人開關 ─────────────────────────────────────────────────
    # 這條永遠在響。它不代表任何故障。
    #
    # 判讀方式跟其他所有告警相反：**收到它是正常，收不到才是異常。**
    # Alertmanager 每 5 分鐘把它送到 /heartbeat；正式環境會改送到外部
    # heartbeat 服務，由對方在逾時未收到時反過來通知你。
    #
    # 它涵蓋的是整條鏈路：Prometheus 還在評估規則嗎？Alertmanager 還活著
    # 嗎？webhook 還通嗎?任何一段斷掉，心跳就停 —— 而這是唯一能偵測
    # 「監控系統整個安靜死掉」的方法。
    - alert: DeadMansSwitch
      expr: vector(1)
      labels: { severity: none, category: meta, service: monitoring }
      annotations:
        summary: "心跳 —— 收到代表告警鏈路正常"
        description: >-
          這條告警刻意永遠處於 firing 狀態，用來證明
          Prometheus 規則評估 → Alertmanager 路由 → 通知管道
          這整條鏈路是通的。**它停止抵達，才是需要處理的事件。**
          外部 heartbeat 服務的逾時應設為遠大於 5 分鐘（建議 15 分鐘）。
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/monitoring-degraded.md"

    # ── 採集面 ───────────────────────────────────────────────────
    # 排除 job="node"：主機掛掉由 HostDown 負責，這裡只管其他採集目標。
    - alert: ScrapeTargetDown
      expr: up{job!="node"} == 0
      for: 5m
      labels: { severity: warning, category: meta, service: "{{ $labels.job }}" }
      annotations:
        summary: "採集目標 {{ $labels.job }}/{{ $labels.instance }} 抓不到"
        description: >-
          Prometheus 連續 5 分鐘無法採集這個目標。該目標的所有指標
          都會停止更新 —— 而依賴它的告警會安靜下來，看起來像一切正常。
          這正是「沉默 ≠ 健康」在監控層的版本。
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/monitoring-degraded.md"

    - alert: ScrapeDurationHigh
      expr: scrape_duration_seconds > 5
      for: 10m
      labels: { severity: warning, category: meta, service: "{{ $labels.job }}" }
      annotations:
        summary: "{{ $labels.job }} 採集耗時 {{ $value | humanizeDuration }}"
        description: >-
          採集時間逼近 scrape_interval（15s）。超過就會開始漏採樣，
          指標出現破洞，而 rate() 與 avg_over_time() 會靜靜地算錯。
          通常代表目標本身在飽和。
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/monitoring-degraded.md"

    # ── 規則評估面 ───────────────────────────────────────────────
    # 規則評估失敗 = 告警不再被計算 = 靜默失效。
    # 這是整組裡最危險的一條：沒有任何症狀，只是不再有人在看。
    - alert: PrometheusRuleEvaluationFailing
      expr: increase(prometheus_rule_evaluation_failures_total[10m]) > 0
      for: 5m
      labels: { severity: critical, category: meta, service: prometheus }
      annotations:
        summary: "Prometheus 規則評估失敗（群組 {{ $labels.rule_group }}）"
        description: >-
          規則評估失敗代表該群組的告警與記錄規則**沒有被計算**。
          告警不會響，記錄序列會出現破洞，而儀表板不會顯示任何異常。
          常見原因：規則引用了不存在的指標、查詢逾時、或 subquery 太貴。
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/monitoring-degraded.md"

    - alert: PrometheusTsdbCompactionFailing
      expr: increase(prometheus_tsdb_compactions_failed_total[1h]) > 0
      for: 15m
      labels: { severity: warning, category: meta, service: prometheus }
      annotations:
        summary: "Prometheus TSDB compaction 失敗"
        description: >-
          Compaction 失敗會讓磁碟用量持續上升，最終寫入停止。
          先確認磁碟空間（見 disk-capacity runbook）與 /prometheus 的權限。
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/monitoring-degraded.md"


    # ── 採集器新鮮度 ─────────────────────────────────────────────
    # 這兩條補的是整套堆疊裡最陰險的一個盲點。
    #
    # jvm.prom / engine.prom 由 cron 每 30 秒寫入，node_exporter 再讀出來。
    # 如果 cron 掛了或腳本開始失敗，檔案就停止更新 ——
    # **但 node_exporter 會永遠繼續吐最後一次寫入的值。**
    #
    # 後果不是「指標消失」，而是「指標凍結在最後一個值」，例如：
    #
    #   jvm_jstat_attach_success      凍結在 1（成功）
    #     → JstatAttachFailed 這條告警永遠不可能觸發，
    #       而它存在的唯一理由，就是事故 #1 當時 attach 失敗是關鍵診斷訊號。
    #
    #   jvm_oldgen_utilization_ratio  凍結在健康值
    #     → JVM 正在走向死亡螺旋，儀表板卻一片正常。
    #
    # 這就是本專案兩次事故的形狀，再深一層：不是服務安靜，
    # 是「觀測服務的那隻眼睛」安靜了，而畫面停在最後一幀。
    - alert: TextfileCollectorStale
      expr: time() - node_textfile_mtime_seconds > 180
      for: 2m
      labels: { severity: critical, category: meta, service: textfile-collector }
      annotations:
        summary: "{{ $labels.file }} 已 {{ $value | humanizeDuration }} 沒有更新"
        description: >-
          textfile 採集器停止寫入，但 node_exporter 仍在提供**上一次寫入的舊值**。
          依賴這個檔案的所有指標都已凍結，看起來正常但其實不再反映現實。
          寫入週期為 30 秒（兩條 cron，其中一條 offset 30s），
          門檻 180 秒代表連續漏了約 6 次。
          先確認 cron 還在跑：crontab -l | grep jstat
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/monitoring-degraded.md"

    - alert: TextfileCollectorError
      expr: node_textfile_scrape_error > 0
      for: 5m
      labels: { severity: warning, category: meta, service: textfile-collector }
      annotations:
        summary: "node_exporter 無法解析 textfile 目錄"
        description: >-
          node_exporter 讀 textfile 時發生錯誤，通常是某個 .prom 檔格式壞掉
          （寫到一半、權限、或指標名稱不合法）。此時該檔案的指標會整批消失，
          而不是凍結 —— 兩種失效模式都要分開偵測。
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/monitoring-degraded.md"

    # ── 通知面 ───────────────────────────────────────────────────
    # 告警算對了、也路由了，但送不出去 —— 對值班的人來說等同於沒有告警。
    - alert: AlertmanagerNotificationFailing
      expr: increase(alertmanager_notifications_failed_total[10m]) > 0
      for: 5m
      labels: { severity: critical, category: meta, service: alertmanager }
      annotations:
        summary: "Alertmanager 通知送出失敗（{{ $labels.integration }}）"
        description: >-
          規則判斷正確、路由也對，但通知沒送到。對值班的人而言，
          這跟「完全沒有監控」是同一件事，差別只在你以為自己有。
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/monitoring-degraded.md"

# ─────────────────────────────────────────────────────────────────
# 8. 應用層 —— 請求真的成功了嗎？
#
#    在 payment-api 開始暴露 /metrics 之前，這個問題無法回答。
#    黑箱探測只打 /health，它回 200 不代表 /payments 沒有在噴 500。
#
#    這一組只有一條規則，是刻意的：延遲已經由 ServiceSlowResponse
#    （黑箱視角）與 SLO 燒錄率（預算視角）覆蓋，再加一條 p99 告警
#    只會製造重複通知。錯誤率則是全新的訊號 —— 過去完全沒有。
# ─────────────────────────────────────────────────────────────────
- name: application
  rules:

    - alert: PaymentApiErrorRateHigh
      expr: >-
        sum by (deployment) (rate(payment_requests_total{status=~"5.."}[5m]))
        /
        sum by (deployment) (rate(payment_requests_total[5m]))
        > 0.01
      for: 5m
      labels: { severity: critical, category: application, service: payment-api }
      annotations:
        summary: "payment-api（{{ $labels.deployment }}）5xx 比例 {{ $value | humanizePercentage }}"
        description: >-
          伺服器端錯誤佔比連續 5 分鐘超過 1%。這是這套堆疊過去量不到的訊號：
          黑箱探測只打 /health，它回 200 並不代表 /payments 沒有在噴 500。
          注意 `deployment` 標籤 —— host 與 container 跑的是同一份程式，
          只有一邊出錯通常代表環境差異（設定、資源限制、相依），
          兩邊一起出錯才是程式本身的問題。
        runbook_url: "https://github.com/benson-code/trading-engine-reliability/blob/main/docs/runbooks/payment-api-error-rate.md"
