# ══════════════════════════════════════════════════════════════════
#  Prometheus —— 採集與規則評估
#
#  網路架構註記：本機（Oracle Cloud）的 iptables 會擋掉
#  container → host 的流量，所以整套堆疊改用 network_mode: host，
#  全部透過 127.0.0.1 互通。這同時解除了原本被迫只能用
#  textfile collector 的限制 —— 現在可以直接抓 exporter。
# ══════════════════════════════════════════════════════════════════

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: orion-dev
    env: dev

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/slo.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

scrape_configs:

  # ── 自我監控 ────────────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['127.0.0.1:9093']

  # 告警鏈路的最後一哩：webhook 之後那一段（LINE / 心跳）有沒有真的送到。
  # Alertmanager 的 notifications_failed_total 只看到 webhook 回不回 200。
  - job_name: alert-notifier
    static_configs:
      - targets: ['127.0.0.1:9199']

  # ── 應用層：payment-api 自己暴露的 RED 指標 ──────────────────────
  #
  #    在這個 job 出現之前，關於這支服務的每一個訊號都來自外部黑箱探測。
  #    黑箱能回答「活著嗎」，但回答不了定義一支請求型服務的三個問題：
  #    多少請求（Rate）、多少失敗（Errors）、花多久（Duration）。
  #
  #    ⚠ 這一層跟 node 的 textfile collector（jstat）刻意並存，不是取代：
  #    /metrics 由這支 JVM 自己提供，事故 #1 那種 GC 飽和會把它一起餓死。
  #    外部採集器才是獨立的觀測者。兩者同時失聯 = 進程真的完了。
  - job_name: payment-api
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:8091']
        labels: { deployment: host }
      - targets: ['127.0.0.1:8094']
        labels: { deployment: container }

  # ── 應用層：trading-engine 自己暴露的業務指標 ────────────────────
  #
  #    engine_* 以前的路徑：引擎記憶體 → JSON /status → cron curl → python
  #    → .prom 檔 → node_exporter → Prometheus。六跳、30 秒 cron，
  #    而且從來不是獨立觀測 —— 腳本本來就是問引擎自己要數字。
  #    現在引擎直接在 /metrics 提供，15 秒粒度，少掉 cron 這個相依。
  #
  #    ⚠ 這個 job 刻意「沒有」jvm_*：那些留給 jstat textfile（node job）。
  #    jstat 從外部 attach，是 GC 飽和時仍活著的獨立觀測者；
  #    而且同名指標若兩邊都有，同一個 JVM 會產生兩條告警。
  - job_name: trading-engine
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:8092']
        labels: { service: trading-engine }

  # ── 主機層：CPU / 記憶體 / 磁碟 / 網路 ──────────────────────────
  #    同時透過 textfile collector 帶入 jstat 採樣的 JVM 指標
  #    與 trading-engine 的業務指標（jvm.prom / engine.prom）
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']
        labels:
          instance: orion-dev

  # ── MySQL ───────────────────────────────────────────────────────
  - job_name: mysql
    static_configs:
      - targets: ['127.0.0.1:9104']
        labels:
          instance: orion-dev
          service: mysql

  # ── Redis ───────────────────────────────────────────────────────
  - job_name: redis
    static_configs:
      - targets: ['127.0.0.1:9121']
        labels:
          instance: orion-dev
          service: redis

  # ── 黑箱探測 ────────────────────────────────────────────────────
  #    這段 relabel 是 Prometheus 的經典模式，值得看懂：
  #      1. __address__ 原本是被探測的目標（例：127.0.0.1:8091）
  #      2. 把它搬到 __param_target（blackbox 的查詢參數）
  #      3. 再把 __address__ 覆寫成 blackbox exporter 自己的位址
  #    → Prometheus 實際去打 blackbox，blackbox 才去打目標。
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_health_body]
    static_configs:
      - targets:
          - http://127.0.0.1:8091/api/v1/health      # payment-api（主機 JVM）
          - http://127.0.0.1:8094/api/v1/health      # payment-api（容器）
        labels:
          service: payment-api
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  # ── 合成交易探測 ────────────────────────────────────────────────
  #    上面的 blackbox-http 只打 /health。這一個真的送出付款請求，
  #    走完 HTTP → 驗證 → repository → 回應的完整路徑。
  #    失敗會由既有的 ServiceDown（probe_success == 0）接住，
  #    不需要新增告警 —— 使用者的交易路徑掛了，就是服務掛了。
  - job_name: blackbox-transaction
    metrics_path: /probe
    params:
      module: [payment_create]
    static_configs:
      - targets:
          - http://127.0.0.1:8091/api/v1/payments    # payment-api（主機 JVM）
        labels:
          service: payment-api
          probe_kind: synthetic-transaction
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: blackbox-status
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://127.0.0.1:8092/api/v1/status      # trading-engine
        labels:
          service: trading-engine
      - targets:
          - http://127.0.0.1:3000                    # 前端 UI
        labels:
          service: trading-engine-ui
      - targets:
          - http://127.0.0.1:3001/api/health         # Grafana 自身
        labels:
          service: grafana
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  # ── TCP 層探測：DB / cache 的連通性 ─────────────────────────────
  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ['127.0.0.1:3306']
        labels: { service: mysql }
      - targets: ['127.0.0.1:6379']
        labels: { service: redis }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
