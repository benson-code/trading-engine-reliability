apiVersion: 1
datasources:
  - name: Prometheus
    # uid 必須固定 —— 儀表板 JSON 用它來指定資料源。
    # 不指定的話 Grafana 會隨機產生，重建後儀表板就會指向不存在的資料源。
    uid: prometheus
    type: prometheus
    access: proxy
    # network_mode: host 之後，容器間的 DNS 名稱（prometheus:9090）不再存在，
    # 全部改走 127.0.0.1。
    url: http://127.0.0.1:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST
