# ══════════════════════════════════════════════════════════════════
#  payment-api — Kubernetes 部署
#
#  這份設定的重點在兩支 probe。它們刻意檢查不同的東西，
#  而那個差別正是 2026-07 兩次事故教會我的事。
# ══════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Namespace
metadata:
  name: payment
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-api-config
  namespace: payment
data:
  PAYMENT_PORT: "8091"
  PAYMENT_REPO: "memory"
  JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: payment
  labels: { app: payment-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: payment-api }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0      # 更新期間不減少可用副本 —— 零停機
      maxSurge: 1
  template:
    metadata:
      labels: { app: payment-api }
    spec:
      securityContext:
        runAsNonRoot: true    # image 裡建了 appuser(10001)，沒有的話這裡會起不來
        runAsUser: 10001
      containers:
        - name: payment-api
          image: docker.io/library/payment-api:local
          imagePullPolicy: Never       # 本機 image，由 ctr images import 匯入
          ports:
            - { name: http, containerPort: 8091 }
          envFrom:
            - configMapRef: { name: payment-api-config }

          # ── 資源限制 ────────────────────────────────────────────
          # limit 決定了 cgroup 的記憶體上限，也就是 OOMKilled 的門檻。
          # ⚠️ 注意 JVM 的 heap 上限（MaxRAMPercentage 75%）低於這個 limit，
          #    所以 JVM 會先撞到自己的天花板 —— 容器永遠碰不到 cgroup limit。
          #    這正是 2026-07 的 GC 死亡螺旋不會觸發 OOMKilled 的原因。
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits:   { memory: "512Mi", cpu: "500m" }

          # ── liveness：進程還活著嗎 ──────────────────────────────
          # 失敗 → kubelet 殺掉 pod 重啟。
          # 事故 #1（GC 飽和）：HTTP 逾時 → 這支會失敗 → 重啟 →
          #   洩漏歸零重來，看起來「自我修復」了，但根因永遠查不到，
          #   而且每次重啟都銷毀現場證據。
          # 事故 #2（worker 停擺）：/health 正確回 200 → 這支會通過 →
          #   完全偵測不到。
          livenessProbe:
            httpGet: { path: /api/v1/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          # ── readiness：這個副本現在能不能接流量 ──────────────────
          # 失敗 → 從 Service 的 endpoint 移除，但**不重啟**。
          # 這是比 liveness 更該投資的一支：它能把有問題的副本摘掉，
          # 同時保留現場讓人去查。
          readinessProbe:
            httpGet: { path: /api/v1/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2
            successThreshold: 1

          # ── startup：慢啟動的服務要用這支保護 liveness ──────────
          # 沒有它的話，JVM 暖機期間 liveness 會誤判成故障而不斷重啟。
          startupProbe:
            httpGet: { path: /api/v1/health, port: http }
            periodSeconds: 5
            failureThreshold: 12      # 最多容忍 60 秒啟動時間
---
apiVersion: v1
kind: Service
metadata:
  name: payment-api
  namespace: payment
spec:
  type: NodePort
  selector: { app: payment-api }
  ports:
    - { name: http, port: 80, targetPort: http, nodePort: 30091 }
